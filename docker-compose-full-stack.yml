# Docker Compose configuration for Passwordless Multi-Auth with complete ELK Stack
# Note: version field is obsolete in Docker Compose v2.x+

services:
  # -------------------------------------------
  # Core application and infrastructure services
  # -------------------------------------------
  passwordless-app:
    build: .
    container_name: passwordless_app
    ports:
      - "8585:8585"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/passwordlessdb
      - DB_USERNAME=passwordless
      - DB_PASSWORD=passwordless
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=465 # 465 SSL, 587 TLS
      - MAIL_USERNAME=user@example.com
      - MAIL_PASSWORD=${MAIL_PASSWORD} 
    volumes:
      - ./logs:/app/logs # Write application logs to the host machine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - passwordless_network

  postgres:
    image: postgres:18-alpine
    container_name: passwordless_postgres
    environment:
      POSTGRES_DB: passwordlessdb
      POSTGRES_USER: passwordless
      POSTGRES_PASSWORD: passwordless
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passwordless"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - passwordless_network

  redis:
    image: redis:7-alpine
    container_name: passwordless_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - passwordless_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: passwordless_mailpit
    ports:
      - 8025:8025
      - 1025:1025
    networks:
      - passwordless_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: passwordless_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - passwordless_network

  # -------------------------------------------
  # Monitoring stack
  # -------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: passwordless_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - passwordless_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: passwordless_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - passwordless_network
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: passwordless_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - passwordless_network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: passwordless_redis_exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - passwordless_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: passwordless_postgres_exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://passwordless:passwordless@postgres:5432/passwordlessdb?sslmode=disable
    networks:
      - passwordless_network

  # -------------------------------------------
  # ELK Stack (Elasticsearch, Logstash, Kibana, Filebeat)
  # Complete logging and monitoring solution
  # -------------------------------------------
  
  # Elasticsearch - Search and analytics engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: passwordless_elasticsearch
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "xpack.monitoring.collection.enabled=true"
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"  # Increased memory allocation
      - "bootstrap.memory_lock=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9300:9300"  # Inter-node communication
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - passwordless_network
    restart: unless-stopped

  # Logstash - Data processing pipeline
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: passwordless_logstash
    environment:
      - "LS_JAVA_OPTS=-Xmx768m -Xms768m"
      - "PIPELINE_WORKERS=2"
    ports:
      - "5044:5044"    # Beats input
      - "5000:5000/tcp" # TCP input
      - "5000:5000/udp" # UDP input
      - "9600:9600"     # Logstash monitoring API
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config:/usr/share/logstash/config:ro
      - ./logstash/patterns:/usr/share/logstash/patterns:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - passwordless_network
    restart: unless-stopped

  # Kibana - Data visualization and exploration
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: passwordless_kibana
    environment:
      - "ELASTICSEARCH_HOSTS=http://elasticsearch:9200"
      - "SERVER_NAME=passwordless-kibana"
      - "SERVER_HOST=0.0.0.0"
      - "XPACK_MONITORING_ENABLED=true"
      - "XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=a7a6311933d3503b89bc2dbc36572c33a7a6311933d3503b"
    ports:
      - "5601:5601"
    volumes:
      - kibana_data:/usr/share/kibana/data
      - ./elk/kibana/config:/usr/share/kibana/config:ro
      - ./elk/kibana/dashboards:/usr/share/kibana/dashboards:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - passwordless_network
    restart: unless-stopped

  # Filebeat - Log shipping agent
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: passwordless_filebeat
    user: root
    environment:
      - "ELASTICSEARCH_HOSTS=http://elasticsearch:9200"
      - "LOGSTASH_HOSTS=logstash:5044"
    volumes:
      - ./filebeat.docker.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/app_logs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_healthy
      passwordless-app:
        condition: service_started
    command: ["filebeat", "-e", "-strict.perms=false"]
    networks:
      - passwordless_network
    restart: unless-stopped

  # Elasticsearch Head - Web front end for browsing and interacting with an Elasticsearch cluster
  elasticsearch-head:
    image: mobz/elasticsearch-head:5
    container_name: passwordless_elasticsearch_head
    ports:
      - "9100:9100"
    depends_on:
      - elasticsearch
    networks:
      - passwordless_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  es_data:
  kibana_data:
  filebeat_data:

networks:
  passwordless_network:
    driver: bridge
