services:
  # Optional: run the app itself as a container (started by start-prod.sh).
  # The `docker` profile points at the postgres/redis/mailpit services below.
  # For day-to-day development, skip this and run `./mvnw spring-boot:run` instead.
  passwordless-app:
    build: .
    container_name: passwordless_app
    ports:
      - "8585:8585"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - ./logs:/app/logs # Write application logs to the host machine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - passwordless_network
  postgres:
    image: postgres:18.3-alpine
    container_name: passwordless_postgres
    environment:
      POSTGRES_USER: passwordless
      POSTGRES_PASSWORD: passwordless
      POSTGRES_DB: passwordlessdb
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ expects the mount at /var/lib/postgresql (not .../data)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passwordless"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - passwordless_network

  redis:
    image: redis:8.6.1-alpine
    container_name: passwordless_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - passwordless_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: passwordless_mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - passwordless_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: passwordless_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - passwordless_network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  passwordless_network:
    driver: bridge