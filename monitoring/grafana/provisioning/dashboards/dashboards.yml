# Grafana dashboard provisioning configuration
apiVersion: 1

providers:
  - name: 'passwordless-dashboards'
    orgId: 1
    folder: 'Passwordless Multi-Auth'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards