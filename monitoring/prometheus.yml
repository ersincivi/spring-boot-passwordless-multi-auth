# Prometheus configuration for Passwordless Multi-Auth monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files: []

# Scrape configuration containing exactly one endpoint to scrape:
scrape_configs:
  # Passwordless Multi-Auth Application (host network)
  - job_name: 'passwordless-ai'
    static_configs:
      - targets: ['host.docker.internal:8585']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    scrape_timeout: 3s
    # T5.2: the platform is passwordless (basic auth can never succeed) -
    # scrape auth uses the static Bearer token set as MONITORING_TOKEN on the app.
    authorization:
      type: Bearer
      credentials: 'CHANGE_ME'  # same value as MONITORING_TOKEN on the app; supply via credentials_file or a deploy-time template
    
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 5s

  # Redis metrics
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 5s

  # PostgreSQL metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 5s

  # Custom monitoring endpoints (host network)
  - job_name: 'passwordless-ai-monitoring'
    static_configs:
      - targets: ['host.docker.internal:8585']
    metrics_path: '/monitor/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    # T5.2: Bearer token auth - same value as MONITORING_TOKEN on the app
    authorization:
      type: Bearer
      credentials: 'CHANGE_ME'  # same value as MONITORING_TOKEN on the app; supply via credentials_file or a deploy-time template