# Enhanced Logstash Pipeline Configuration
# Comprehensive log parsing for Passwordless Multi-Auth application

input {
  # Primary input from Filebeat
  beats {
    port => 5044
    host => "0.0.0.0"
  }
  
  # Additional TCP input for direct log shipping
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp"]
  }
  
  # UDP input for syslog-style messages
  udp {
    port => 5000
    codec => json_lines
    tags => ["udp"]
  }
}

filter {
  # Add processing timestamp
  mutate {
    add_field => { "processed_at" => "%{@timestamp}" }
  }

  # Security Audit Log Processing
  if [log_type] == "security_audit" {
    # Remove AUDIT_EVENT prefix if present
    mutate {
      gsub => [ "message", "^AUDIT_EVENT: ", "" ]
      add_tag => [ "security", "audit" ]
    }
    
    # Parse key-value pairs from audit logs
    kv {
      source => "message"
      field_split => ", "
      value_split => "="
      target => "audit"
      remove_field => [ "message" ]
    }
    
    # Parse timestamp from audit logs
    if [audit][timestamp] {
      date {
        match => [ "[audit][timestamp]", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
        target => "@timestamp"
      }
    }
    
    # Enhance security events with threat levels
    if [audit][eventType] {
      if [audit][eventType] in ["LOGIN_FAILURE", "ACCOUNT_LOCKED", "BRUTE_FORCE_ATTEMPT"] {
        mutate { add_field => { "threat_level" => "high" } }
      } else if [audit][eventType] in ["SUSPICIOUS_ACTIVITY", "RATE_LIMIT_EXCEEDED", "INVALID_TOKEN"] {
        mutate { add_field => { "threat_level" => "medium" } }
      } else if [audit][eventType] in ["LOGIN_SUCCESS", "LOGOUT", "PASSWORD_CHANGE"] {
        mutate { add_field => { "threat_level" => "low" } }
      }
    }
    
    # Parse IP addresses for geolocation
    if [audit][clientIp] {
      mutate {
        add_field => { "source_ip" => "%{[audit][clientIp]}" }
      }
      
      # GeoIP enrichment would go here if GeoIP database is available
      # geoip {
      #   source => "source_ip"
      #   target => "geoip"
      # }
    }
  }
  
  # Application Log Processing
  else if [log_type] == "application" {
    # Parse Spring Boot log format
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:log_level}\s+%{NUMBER:pid}\s+---\s+\[(?<thread>[^\]]+)\]\s+%{JAVACLASS:class_name}\s*:\s*%{GREEDYDATA:log_message}"
      }
      tag_on_failure => ["_grokparsefailure_application"]
    }
    
    # Alternative parsing for custom log format
    if "_grokparsefailure_application" in [tags] {
      grok {
        match => {
          "message" => "%{DATA:log_timestamp}\s+%{LOGLEVEL:log_level}\s+%{JAVACLASS:class_name}:\s+%{GREEDYDATA:log_message}"
        }
        tag_on_failure => ["_grokparsefailure_custom"]
        remove_tag => ["_grokparsefailure_application"]
      }
    }
    
    # Parse timestamp
    if [log_timestamp] {
      date {
        match => [ "log_timestamp", "dd-MM-yyyy HH:mm:ss.SSS", "dd-MM-yyyy HH:mm:ss", "ISO8601" ]
        target => "@timestamp"
      }
    }
    
    # Enhance log level classification
    if [log_level] {
      if [log_level] == "ERROR" {
        mutate { add_tag => [ "error", "needs_attention" ] }
      } else if [log_level] == "WARN" {
        mutate { add_tag => [ "warning" ] }
      } else if [log_level] == "DEBUG" {
        mutate { add_tag => [ "debug" ] }
      }
    }
    
    # Extract stack traces
    if [log_message] =~ /Exception|Error|Stacktrace/ {
      mutate {
        add_tag => [ "exception", "stacktrace" ]
        add_field => { "has_exception" => "true" }
      }
    }
    
    # Detect SQL queries
    if [log_message] =~ /SELECT|INSERT|UPDATE|DELETE|CREATE|DROP/ {
      mutate { add_tag => [ "sql", "database" ] }
    }
    
    # Detect HTTP requests
    if [log_message] =~ /HTTP|GET|POST|PUT|DELETE|PATCH/ {
      mutate { add_tag => [ "http", "web_request" ] }
    }
  }
  
  # Container Log Processing
  else if [log_type] == "container" {
    # Parse Docker container logs
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:container_timestamp}\s+%{GREEDYDATA:container_message}"
      }
    }
    
    mutate { add_tag => [ "docker", "container" ] }
  }
  
  # Performance metrics extraction
  if [log_message] {
    # Extract response times
    grok {
      match => {
        "log_message" => ".*response.?time[:\s=]+(?<response_time>\d+).*"
      }
      tag_on_failure => []
    }
    
    # Extract memory usage
    grok {
      match => {
        "log_message" => ".*memory[:\s=]+(?<memory_usage>\d+).*"
      }
      tag_on_failure => []
    }
  }
  
  # Remove sensitive information
  mutate {
    gsub => [
      "log_message", "password=\w+", "password=***",
      "log_message", "token=\w+", "token=***",
      "log_message", "apikey=\w+", "apikey=***"
    ]
  }
  
  # Clean up temporary fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "@version" ]
  }
}

output {
  # Primary output to Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    
    # Use different indices based on log type
    if [log_type] == "security_audit" {
      index => "security-audit-%{+YYYY.MM.dd}"
    } else if [log_type] == "application" {
      index => "application-logs-%{+YYYY.MM.dd}"
    } else if [log_type] == "container" {
      index => "container-logs-%{+YYYY.MM.dd}"
    } else {
      index => "passwordless-%{+YYYY.MM.dd}"
    }
    
    # Index template settings
    template_name => "passwordless-template"
    template_pattern => ["passwordless-*", "security-audit-*", "application-logs-*", "container-logs-*"]
    template => {
      "settings" => {
        "number_of_shards" => 1,
        "number_of_replicas" => 0,
        "index.refresh_interval" => "5s"
      },
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" },
          "log_level" => { "type" => "keyword" },
          "threat_level" => { "type" => "keyword" },
          "source_ip" => { "type" => "ip" },
          "response_time" => { "type" => "integer" },
          "memory_usage" => { "type" => "integer" }
        }
      }
    }
  }
  
  # Conditional outputs for high-priority events
  if [threat_level] == "high" or "error" in [tags] {
    # Could send to alerting system here
    # email {
    #   to => "security@yourcompany.com"
    #   subject => "High Priority Security Event"
    #   body => "Event: %{message}"
    # }
  }
  
  # Debug output to console (remove in production)
  if [log_level] == "DEBUG" or "debug" in [tags] {
    stdout { 
      codec => rubydebug {
        metadata => false
      }
    }
  }
}
