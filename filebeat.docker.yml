# Filebeat Docker Configuration for Passwordless Multi-Auth Project
# Enhanced configuration for comprehensive log collection

filebeat.inputs:
# Application Logs - Main application log file
- type: log
  enabled: true
  paths:
    - /var/log/app_logs/passwordless.log
  fields:
    log_type: application
    service: passwordless-app
    environment: production
  fields_under_root: true
  multiline.type: pattern
  multiline.pattern: '^\d{2}-\d{2}-\d{4}'
  multiline.negate: true
  multiline.match: after
  multiline.max_lines: 500
  scan_frequency: 10s
  harvester_buffer_size: 16384
  max_bytes: 10485760

# Security Audit Logs - Dedicated security event logging
- type: log
  enabled: true
  paths:
    - /var/log/app_logs/security_audit.log
  fields:
    log_type: security_audit
    service: passwordless-app
    environment: production
    priority: high
  fields_under_root: true
  scan_frequency: 5s
  harvester_buffer_size: 16384
  max_bytes: 10485760

# Archived Logs - Historical log files
- type: log
  enabled: true
  paths:
    - /var/log/app_logs/archived/*.log
  fields:
    log_type: archived
    service: passwordless-app
    environment: production
  fields_under_root: true
  exclude_files: ['.*\.gz$']
  scan_frequency: 60s

# Docker Container Logs - Additional container logs
- type: container
  enabled: true
  paths:
    - /var/lib/docker/containers/*/*.log
  fields:
    log_type: container
    service: docker
  fields_under_root: true
  include_lines: ['passwordless']

# Processors for log enhancement
processors:
- add_host_metadata:
    when.not.contains.tags: forwarded
- add_docker_metadata: ~
- add_kubernetes_metadata: ~
- timestamp:
    field: '@timestamp'
    layouts:
      - '2006-01-02 15:04:05'
      - '2006-01-02T15:04:05.000Z'
    test:
      - '2023-12-25 10:30:45'
- drop_fields:
    fields: ["agent", "ecs", "host.architecture", "host.os.family"]
    ignore_missing: true

# Output to Logstash for processing
output.logstash:
  hosts: ["logstash:5044"]
  compression_level: 3
  bulk_max_size: 2048
  worker: 2
  loadbalance: true
  backoff.init: 1s
  backoff.max: 60s

# Logging configuration
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

# Monitoring
monitoring:
  enabled: true
  elasticsearch:
    hosts: ["http://elasticsearch:9200"]

# Performance tuning
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 1s