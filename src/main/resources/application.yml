# PROFILE: PRODUCTION (prod)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # For very high-traffic applications, a value of 50-100 can be tried.
      maximum-pool-size: 40 #Max 100
      # Minimum number of idle connections kept in the pool.
      # Under high traffic, reduces the cost of repeatedly opening/closing connections.
      minimum-idle: 10 # Max 30
      # Maximum idle time for a pooled connection (ms).
      # Takes effect when minimum-idle is set.
      idle-timeout: 600000 # 10 minutes (600 seconds)
      # Maximum time a client (the app) waits to obtain a connection (ms).
      connection-timeout: 5000
      # Maximum lifetime of a connection in the pool (ms).
      # Must be SHORTER than idle-timeout and the database timeout setting.
      # Usually kept slightly below 30 minutes (1800000 ms).
      max-lifetime: 1740000 # 29 minutes
      # Used to detect slow queries or connection leaks (ms).
      # A connection unused longer than this is logged.
      leak-detection-threshold: 2000 # 2 seconds
      # Pool name; helps when tracing logs.
      pool-name: HikariHighTrafficPool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        '[format_sql]': false
        '[show_sql]': false
        '[use_sql_comments]': false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Production server configuration
server:
  port: ${PORT:8585}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true} # T5.1: HTTPS-only session cookie in production
        http-only: true
        same-site: lax

# Production configuration for app
app:
  jwt:
    secret: ${JWT_SECRET} # T2.1: no default - MUST BE SET AS ENVIRONMENT VARIABLE (min 32 bytes)
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:2592000}
  mobile:
    callback-url: ${APP_MOBILE_CALLBACK_URL:passwordless://auth/callback}
  security:
    hsts-enabled: ${SECURITY_HSTS_ENABLED:true}
    secure-cookies: ${SECURITY_SECURE_COOKIES:true}
    referrer-policy: ${SECURITY_REFERRER_POLICY:ORIGIN_WHEN_CROSS_ORIGIN}
  monitoring:
    token: ${MONITORING_TOKEN:}  # T5.2: Bearer token for Prometheus scrapes (blank = ADMIN-only)
  queue:
    email:
      key: ${QUEUE_EMAIL_KEY:passwordless:queue:email}
      poll-ms: ${QUEUE_EMAIL_POLL_MS:1000}
      delayed-key: ${QUEUE_EMAIL_DELAYED_KEY:passwordless:queue:email:delayed}
      delayed-poll-ms: ${QUEUE_EMAIL_DELAYED_POLL_MS:1000}
      geo-alert-delay-ms: ${QUEUE_EMAIL_GEO_ALERT_DELAY_MS:10000}  # 10 seconds delay for GEO_ALERT emails
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://yourdomain.com}
  captcha:
    enabled: false
    length: 5
    width: 200
    height: 80
    ttl: 300
    threshold: 3
  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:true}
    secret: ${RECAPTCHA_SECRET}
  account-lockout:
    max-failed-attempts: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:10}
    lockout-duration-minutes: ${ACCOUNT_LOCKOUT_DURATION:20}
    attempt-window-minutes: ${ACCOUNT_LOCKOUT_WINDOW:15}
  rate-limit:
    threshold: ${RATE_LIMIT_THRESHOLD:20}
    login-attempts:
      limit: ${RATE_LIMIT_LOGIN_LIMIT:15}
      duration: ${RATE_LIMIT_LOGIN_DURATION:10}
      unit: ${RATE_LIMIT_LOGIN_UNIT:MINUTES}
      algorithm: ${RATE_LIMIT_LOGIN_ALGORITHM:FIXED_WINDOW}
    api-requests:
      limit: ${RATE_LIMIT_API_LIMIT:100}
      duration: ${RATE_LIMIT_API_DURATION:1}
      unit: ${RATE_LIMIT_API_UNIT:HOURS}
      algorithm: ${RATE_LIMIT_API_ALGORITHM:SLIDING_WINDOW}
    otp-verification:
      limit: ${RATE_LIMIT_OTP_LIMIT:20}
      duration: ${RATE_LIMIT_OTP_DURATION:10}
      unit: ${RATE_LIMIT_OTP_UNIT:MINUTES}
      algorithm: ${RATE_LIMIT_OTP_ALGORITHM:TOKEN_BUCKET}
    totp-verification:
      limit: ${RATE_LIMIT_TOTP_LIMIT:20}
      duration: ${RATE_LIMIT_TOTP_DURATION:10}
      unit: ${RATE_LIMIT_TOTP_UNIT:MINUTES}
      algorithm: ${RATE_LIMIT_TOTP_ALGORITHM:TOKEN_BUCKET}
    admin-actions:
      limit: ${RATE_LIMIT_ADMIN_LIMIT:50}
      duration: ${RATE_LIMIT_ADMIN_DURATION:1}
      unit: ${RATE_LIMIT_ADMIN_UNIT:HOURS}
      algorithm: ${RATE_LIMIT_ADMIN_ALGORITHM:LEAKY_BUCKET}
  twilio:
    enabled: ${TWILIO_ENABLED:false}
    accountSid: ${TWILIO_ACCOUNT_SID}
    authToken: ${TWILIO_AUTH_TOKEN}
    fromNumber: ${TWILIO_FROM_NUMBER}
  geoip:
    database: ${GEOIP_DATABASE_PATH:classpath:static/GeoLite2-City.mmdb}
    enabled: ${GEOIP_ENABLED:true}
    # No silent downloads in production - provide the database explicitly
    auto-download: ${GEOIP_AUTO_DOWNLOAD:false}

# Production configuration for management
management:
  endpoint:
    health:
      show-details: never
      show-components: never
  metrics:
    tags:
      application: passwordless
      environment: prod