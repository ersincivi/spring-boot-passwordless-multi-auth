# SPRING CONFIGURATION
spring:
  application:
    name: passwordless
  main:
    banner-mode: "off" #no banner
  profiles:
    active: dev #dev, prod, docker
  session:
    timeout: 30m
    data:
      redis:
        namespace: passwordless
        repository-type: indexed
  cache:
    type: REDIS
    redis:
      time-to-live: 600000
  thymeleaf:
    cache: false
  security:
    oauth2:
      client:
        registration:
          google:
            # Optional: defaults keep the app bootable without OAuth keys;
            # Google login only works when the real values are set in the environment.
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-set}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-not-set}
            redirect-uri: http://localhost:8585/login/oauth2/code/google
            scope:
              - openid
              - profile
              - email
          github:
            # Optional: see the note on the Google registration above.
            client-id: ${GITHUB_CLIENT_ID:github-client-id-not-set}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret-not-set}
            redirect-uri: http://localhost:8585/login/oauth2/code/github
            scope: # Scopes requested from the user
              - read:user 
              - user:email
        provider:
          google:
            issuer-uri: https://accounts.google.com
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id
# Common server configuration
server:
  port: 8585
  # For this to work correctly behind Nginx, the corresponding settings must be added on the Nginx side.
  # proxy_set_header X-Forwarded-For $remote_addr;
  # proxy_set_header X-Forwarded-Proto $scheme;
  forward-headers-strategy: framework
#   tomcat:
#     remoteip:
#       host-header: x-forwarded-for
#       protocol-header: x-forwarded-proto

# Common app configuration
app:
  base-url: http://localhost:8585
  jwt:
    ttl-seconds: 3600            # T2.4: short-lived access token (1 hour)
    refresh-ttl-seconds: 2592000 # T2.4: rotating refresh token (30 days)
  mobile:
    callback-url: passwordless://auth/callback # T4.1: app-scheme redirect target for magic-link login
  security:
    hsts-enabled: false          # T5.1: enable in production (HTTPS only)
    secure-cookies: false        # T5.1: enable in production (HTTPS only)
    referrer-policy: NO_REFERRER # T5.1: ORIGIN_WHEN_CROSS_ORIGIN in production
  monitoring:
    token: ""                    # T5.2: Bearer token for Prometheus scrapes (blank = disabled)
  magiclink:
    web:
      ttl-seconds: 120  # 2 minutes for web
    api:
      ttl-seconds: 120  # 2 minutes for mobile API
  queue:
    email:
      key: passwordless:queue:email
      poll-ms: 1000
      delayed-key: passwordless:queue:email:delayed
      delayed-poll-ms: 1000
      geo-alert-delay-ms: 5000  # 5 seconds delay for GEO_ALERT emails
  geoip:
    # GeoLite2 is not bundled (MaxMind license). On first run the app fetches
    # a copy into ./data automatically (auto-download); alternatively point
    # GEOIP_DATABASE_PATH at your own downloaded GeoLite2-City.mmdb.
    database: ${GEOIP_DATABASE_PATH:classpath:static/GeoLite2-City.mmdb}
    enabled: ${GEOIP_ENABLED:true}
    auto-download: ${GEOIP_AUTO_DOWNLOAD:true}
    download-url: ${GEOIP_DOWNLOAD_URL:https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-City.mmdb}
    download-path: ./data/GeoLite2-City.mmdb

# Common management/actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
      base-path: "/actuator"
  endpoint:
    health:
      probes:
        enabled: true
      group:
        custom:
          show-components: when_authorized
          show-details: when_authorized
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,db,redis"
    info:
      access: UNRESTRICTED
    metrics:
      access: UNRESTRICTED
    prometheus:
      access: UNRESTRICTED
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      mode: SIMPLE
  metrics:
    distribution:
      percentiles-histogram:
        '[http.server.requests]': true
  prometheus:
    metrics:
      export:
        enabled: true
        step: PT5M
  server:
    port: 8585

# Common documentation configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    disabled: true
---
# PROFILE: DEVELOPMENT (dev)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/passwordlessdb
    username: passwordless
    password: passwordless
    hikari:
      # For very high-traffic applications, a value of 50-100 can be tried.
      maximum-pool-size: 20 #Max 100
      # Minimum number of idle connections kept in the pool.
      # Under high traffic, reduces the cost of repeatedly opening/closing connections.
      minimum-idle: 5 # Max 30
      # Maximum idle time for a pooled connection (ms).
      # Takes effect when minimum-idle is set.
      idle-timeout: 600000 # 10 minutes (600 seconds)
      # Maximum time a client (the app) waits to obtain a connection (ms).
      connection-timeout: 5000
      # Maximum lifetime of a connection in the pool (ms).
      # Must be SHORTER than idle-timeout and the database timeout setting.
      # Usually kept slightly below 30 minutes (1800000 ms).
      max-lifetime: 1740000 # 29 minutes
      # Used to detect slow queries or connection leaks (ms).
      # A connection unused longer than this is logged.
      leak-detection-threshold: 2000 # 2 seconds
      # Pool name; helps when tracing logs.
      pool-name: HikariHighTrafficPool
  jpa:
    hibernate:
      ddl-auto: update #create-drop, update
    properties:
      hibernate:
        '[format_sql]': true
        '[show_sql]': true
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
  mail:
    host: localhost
    port: 1025
    username: ''
    password: ''
    test-connection: true
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          ssl:
            enable: false

# Development configuration for app
app:
  jwt:
    secret: "d3v3l0pm3nt-s3cr3t-k3y-ch4ng3-m3-pl34s3" # ONLY FOR DEVELOPMENT
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:8585"
    health-origins: "http://localhost:3000,http://localhost:8585"
  captcha:
    enabled: false
    length: 5
    width: 200
    height: 80
    ttl: 300
    threshold: 3
  recaptcha:
    enabled: false
    secret: ''
  account-lockout: # User account lockout 
    max-failed-attempts: 10 # Login page Username/password failed attempts
    lockout-duration-minutes: 20
    attempt-window-minutes: 15
  rate-limit:
    threshold: 20 # Default threshold for all rate limits
    login-attempts: # Login page http (GET/POST) requests
      limit: 20
      duration: 15
      unit: MINUTES
      algorithm: FIXED_WINDOW
    api-requests: # /api requests
      limit: 100
      duration: 1
      unit: HOURS
      algorithm: SLIDING_WINDOW
    otp-verification: # /verfy-otp page requests
      limit: 20
      duration: 5
      unit: MINUTES
      algorithm: TOKEN_BUCKET
    totp-verification: # /totp page requests
      limit: 20
      duration: 5
      unit: MINUTES
      algorithm: TOKEN_BUCKET
    admin-actions: # Admin actions
      limit: 50
      duration: 1
      unit: HOURS
      algorithm: LEAKY_BUCKET
  twilio:
    enabled: false
    accountSid: ''
    authToken: ''
    fromNumber: ''

# Development configuration for management
management:
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: passwordless
      environment: dev
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.oauth2.client: DEBUG
    org.springframework.security.oauth2.core: DEBUG
    io.github.ersincivi.passwordless.service.OAuth2UserService: DEBUG
    io.github.ersincivi.passwordless.service.CustomOidcUserService: DEBUG
