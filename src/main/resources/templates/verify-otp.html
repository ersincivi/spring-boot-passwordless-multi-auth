<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="_csrf" th:content="${_csrf.token}"/>
	<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
	
	<!-- Basic Security Headers -->
	<meta http-equiv="X-Content-Type-Options" content="nosniff">
	<meta http-equiv="X-XSS-Protection" content="1; mode=block">
	<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
	<meta name="robots" content="noindex, nofollow">
	
    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    
	<title th:text="#{verify.title}">Verify OTP - Passwordless Multi-Auth</title>
	
	<style>
		/* Reset and base styles */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(135deg, #6C63FF 0%, #4A44D6 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.verify-container {
			background: rgba(255, 255, 255, 0.95);
			backdrop-filter: blur(10px);
			border-radius: 20px;
			box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
			padding: 30px;
			width: 100%;
			max-width: 450px;
			text-align: center;
			border: 1px solid rgba(255, 255, 255, 0.2);
		}

		.verify-logo {
			margin-bottom: 30px;
		}

		.verify-logo .logo {
			display: flex;
			align-items: center;
			justify-content: center;
			margin-bottom: 10px;
		}

		.logo img {
			width: 100px;
			height: auto;
		}

		.verify-logo .logo .logo-text {
			text-decoration: none;
			font-size: 2.5rem;
			color: #333;
			text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
		}

		.verify-title {
			font-size: 1.8rem;
			font-weight: 600;
			color: #333;
			margin-bottom: 8px;
		}

		.verify-subtitle {
			color: #666;
			font-size: 1rem;
			margin-bottom: 30px;
			line-height: 1.5;
		}

		.email-display {
			background: rgba(102, 126, 234, 0.1);
			border: 1px solid rgba(102, 126, 234, 0.2);
			border-radius: 8px;
			padding: 12px;
			margin-bottom: 20px;
			font-weight: 500;
			color: #1a3ac6;
			word-break: break-all;
		}

		/* Alert Styles */
		.alert {
			padding: 15px;
			border-radius: 8px;
			margin-bottom: 20px;
			display: flex;
			align-items: center;
			gap: 10px;
			font-weight: 500;
		}

		.alert-error {
			background: rgba(239, 68, 68, 0.1);
			color: #dc2626;
			border: 1px solid rgba(239, 68, 68, 0.2);
		}

		.alert-success {
			background: rgba(34, 197, 94, 0.1);
			color: #16a34a;
			border: 1px solid rgba(34, 197, 94, 0.2);
		}

		.alert-icon {
			font-size: 1.2rem;
		}

		/* Form Styles */
		.form-group {
			margin-bottom: 20px;
			text-align: left;
		}

		label {
			display: block;
			margin-bottom: 8px;
			color: #333;
			font-weight: 500;
			font-size: 0.95rem;
		}

		.form-input {
			width: 100%;
			padding: 15px;
			border: 2px solid #e5e7eb;
			border-radius: 12px;
			font-size: 1rem;
			transition: all 0.3s ease;
			background: rgba(255, 255, 255, 0.9);
			text-align: center;
			letter-spacing: 0.1em;
			font-weight: 600;
			font-size: 1.2rem;
		}

		.form-input:focus {
			outline: none;
			border-color: #667eea;
			box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
			background: rgba(255, 255, 255, 1);
		}

		.form-input.valid {
			border-color: #16a34a;
			background: rgba(34, 197, 94, 0.05);
		}

		.form-input.invalid {
			border-color: #dc2626;
			background: rgba(239, 68, 68, 0.05);
		}

		/* Button Styles */
		.verify-btn {
			width: 100%;
			padding: 15px;
			border: none;
			border-radius: 12px;
			background:#4A44D6;
			color: white;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s ease;
			position: relative;
			overflow: hidden;
			margin-bottom: 20px;
		}

		.verify-btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
		}

		.verify-btn:active {
			transform: translateY(0);
		}

		.verify-btn:disabled {
			opacity: 0.7;
			cursor: not-allowed;
			transform: none;
		}

		.btn-text {
			display: inline-block;
		}

		.btn-loader {
			display: none;
		}

		.spinner {
			width: 20px;
			height: 20px;
			border: 2px solid rgba(255, 255, 255, 0.3);
			border-radius: 50%;
			border-top-color: white;
			animation: spin 1s ease-in-out infinite;
			display: inline-block;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		/* Back Link */
		.back-to-login {
			text-align: center;
		}

		.back-to-login a {
			color: #667eea;
			text-decoration: none;
			font-weight: 500;
			transition: color 0.3s ease;
		}

		.back-to-login a:hover {
			color: #764ba2;
			text-decoration: underline;
		}

		/* Security Notice */
		.security-notice {
			font-size: 0.85rem;
			color: #6b7280;
			margin-top: 5px;
			line-height: 1.4;
		}

		/* OTP Input Enhancement */
		.otp-input {
			text-align: center;
			letter-spacing: 0.2em;
			font-size: 1.5rem;
			font-weight: bold;
			padding: 20px;
		}

		/* Responsive Design */
		@media (max-width: 480px) {
			.verify-container {
				padding: 30px 20px;
				margin: 10px;
			}
			
			.verify-logo .logo {
				font-size: 2rem;
			}
			
			.verify-title {
				font-size: 1.5rem;
			}
		}

		/* Animation */
		@keyframes fadeInUp {
			from {
				opacity: 0;
				transform: translateY(30px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.verify-container {
			animation: fadeInUp 0.6s ease-out;
		}
	</style>
</head>
<body>
	<div class="verify-container">
		<div class="verify-logo">
			<div class="logo">
				<a href="/">
					<img src="/images/logo/logo.webp" alt="Logo">
				</a>
			</div>
			<h1 class="verify-title" th:text="#{verify.title}">Code Verification</h1>
			<p class="verify-subtitle" th:text="#{verify.subtitle}">Enter the 6-digit code sent to your email</p>
		</div>

		<!-- Email Display -->
		<div class="email-display" th:if="${email}">
			<span th:text="${email}">your.email@example.com</span>
		</div>

		<!-- Error Message -->
		<div th:if="${error}" class="alert alert-error" role="alert" aria-live="polite">
			<span class="alert-icon" aria-hidden="true">⚠</span>
			<span th:text="#{verify.invalid}">Invalid OTP. Please try again.</span>
		</div>

		<!-- OTP Verification Form -->
		<form th:action="@{/verify-otp}" method="post" class="verify-form" novalidate>
			<!-- CSRF Protection -->
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
			
			<!-- Email Hidden Field -->
			<input type="hidden" name="email" th:value="${email}" />
			
			<div class="form-group">
				<label for="otp" th:text="#{verify.otp}">OTP Code</label>
				<input 
					type="text" 
					id="otp" 
					name="otp" 
					class="form-input otp-input" 
					placeholder="000000"
					maxlength="6" 
					pattern="[0-9]{6}"
					th:title="#{verify.otp.title}"
					title="Please enter a 6-digit OTP code"
					autocomplete="one-time-code"
					inputmode="numeric"
					required 
					autofocus />
				<small class="security-notice" th:text="#{verify.security.notice}">
					The code expires in 15 minutes for your security
				</small>
			</div>

			<button type="submit" class="verify-btn" th:text="#{verify.btn.text}">
				<span class="btn-text">Verify Code</span>
				<div class="btn-loader" style="display: none;">
					<div class="spinner" th:aria-label="#{verify.loading.aria}" aria-label="Loading..."></div>
				</div>
			</button>
		</form>

		<!-- Back to Login Link -->
		<div class="back-to-login">
			<a th:href="@{/login}" role="button" tabindex="0" rel="nofollow">← <span th:text="#{nav.backToLogin}">Back to Login</span></a>
		</div>
	</div>

	<!-- Secure Script Loading -->
	<script th:nonce="${nonce}">
		// OTP Input Enhancement
		document.addEventListener('DOMContentLoaded', function() {
			const otpInput = document.getElementById('otp');
			const form = document.querySelector('.verify-form');
			const submitBtn = document.querySelector('.verify-btn');
			
			if (otpInput && submitBtn) {
				// Function to validate and update button state
				function updateButtonState() {
					const value = otpInput.value.trim();
					const isValid = /^[0-9]{6}$/.test(value);
					
					if (isValid) {
						otpInput.classList.add('valid');
						otpInput.classList.remove('invalid');
						submitBtn.disabled = false;
						submitBtn.style.opacity = '1';
						submitBtn.style.cursor = 'pointer';
					} else {
						otpInput.classList.remove('valid');
						if (value.length > 0) {
							otpInput.classList.add('invalid');
						} else {
							otpInput.classList.remove('invalid');
						}
						submitBtn.disabled = true;
						submitBtn.style.opacity = '0.7';
						submitBtn.style.cursor = 'not-allowed';
					}
				}
				
				// Initial button state
				updateButtonState();
				
				// Input event handler
				otpInput.addEventListener('input', function() {
					// Only allow digits and limit to 6 characters
					this.value = this.value.replace(/[^0-9]/g, '').substring(0, 6);
					
					// Update button state
					updateButtonState();
					
					// Auto-submit when 6 digits are entered
					if (this.value.length === 6) {
						setTimeout(() => {
							if (this.value.length === 6 && !submitBtn.disabled) {
								// Show loading state before submission
								const btnText = submitBtn.querySelector('.btn-text');
								const btnLoader = submitBtn.querySelector('.btn-loader');
								if (btnText) btnText.style.display = 'none';
								if (btnLoader) btnLoader.style.display = 'block';
								submitBtn.disabled = true;
								
								// Submit the form
								form.submit();
							}
						}, 500);
					}
				});

				// Handle paste
				otpInput.addEventListener('paste', function(e) {
					setTimeout(() => {
						let value = e.target.value.replace(/[^0-9]/g, '').substring(0, 6);
						e.target.value = value;
						
						updateButtonState();
						
						if (value.length === 6) {
							setTimeout(() => {
								if (!submitBtn.disabled) {
									// Show loading state before submission
									const btnText = submitBtn.querySelector('.btn-text');
									const btnLoader = submitBtn.querySelector('.btn-loader');
									if (btnText) btnText.style.display = 'none';
									if (btnLoader) btnLoader.style.display = 'block';
									submitBtn.disabled = true;
									
									// Submit the form
									form.submit();
								}
							}, 100);
						}
					}, 0);
				});
				
				// Manual button click handler
				submitBtn.addEventListener('click', function(e) {
					e.preventDefault(); // Prevent default to handle manually
					
					if (!submitBtn.disabled) {
						// Show loading state
						const btnText = submitBtn.querySelector('.btn-text');
						const btnLoader = submitBtn.querySelector('.btn-loader');
						if (btnText) btnText.style.display = 'none';
						if (btnLoader) btnLoader.style.display = 'block';
						submitBtn.disabled = true;
						
						// Submit the form
						form.submit();
					}
				});
			}

			// Auto-focus on page load
			if (otpInput) {
				otpInput.focus();
			}
		});

		// Auto-dismiss alerts after 5 seconds
        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.alert');
            
            alerts.forEach(alert => {
                setTimeout(() => {
                    alert.style.transition = 'all 0.3s ease';
                    alert.style.opacity = '0';
                    alert.style.transform = 'translateY(-10px)';
                    
                    setTimeout(() => {
                        alert.remove();
                    }, 300);
                }, 5000);
            });
        });

		// Security monitoring
		window.addEventListener('error', function(e) {
			console.warn('Security: Script error detected', e.filename);
		});

		// Prevent basic XSS attempts
		if (window.location.hash.includes('script') || window.location.search.includes('<')) {
			window.location.href = '/verify-otp';
		}
	</script>
</body>
</html>
