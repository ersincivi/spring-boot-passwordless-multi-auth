<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA Verification - Passwordless Multi-Auth</title>
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    
    <style th:nonce="${nonce}">
        :root {
            --primary-color: #2563eb;
            --error-color: #dc2626;
            --success-color: #059669;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --border-color: #e2e8f0;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }
        
        .captcha-container {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }
        
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: #64748b;
            font-size: 0.875rem;
        }
        
        .security-notice {
            background: #fef3c7;
            border: 1px solid #fbbf24;
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            color: #92400e;
        }
        
        .captcha-image {
            border: 2px solid var(--border-color);
            border-radius: 6px;
            max-width: 100%;
            height: auto;
            margin-bottom: 1rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 0.1em;
            font-weight: 600;
            text-transform: uppercase;
            box-sizing: border-box;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 0.5rem;
        }
        
        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        
        .btn-primary:hover {
            background: #1d4ed8;
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .alert {
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }
        
        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        
        .alert-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
        
        .alert.show {
            display: block;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            padding: 0.75rem;
            background: var(--background);
            border-radius: 6px;
            font-size: 0.875rem;
        }
        
        .stat-value {
            font-weight: 700;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="captcha-container">
        <div class="header">
            <h1 class="title">🛡️ Security Verification</h1>
            <p class="subtitle">Please complete the CAPTCHA to continue</p>
        </div>
        
        <div class="security-notice">
            <strong>Security Notice:</strong> Multiple failed attempts detected. Verification required.
        </div>
        
        <div id="alert-container">
            <div id="error-alert" class="alert alert-error"></div>
            <div id="success-alert" class="alert alert-success"></div>
        </div>
        
        <form id="captcha-form" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}" id="csrf-token">
            <input type="hidden" name="sessionId" id="session-id" th:value="${sessionId}">
            
            <img id="captcha-image" 
                 class="captcha-image" 
                 src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
                 alt="CAPTCHA challenge image">
            
            <div class="form-group">
                <label for="captcha-input" class="form-label">Enter the characters shown above</label>
                <input type="text" 
                       id="captcha-input" 
                       name="captchaInput" 
                       class="form-input"
                       placeholder="Enter CAPTCHA"
                       maxlength="10"
                       autocomplete="off"
                       required>
            </div>
            
            <button type="submit" class="btn btn-primary" id="verify-btn">
                🔍 Verify
            </button>
            <button type="button" class="btn btn-secondary" id="refresh-btn">
                🔄 New Image
            </button>
        </form>
        
        <div class="stats">
            <div>Attempts: <span class="stat-value" id="attempts">5</span></div>
            <div>Expires: <span class="stat-value" id="expires">5:00</span></div>
        </div>
    </div>
    
    <script th:nonce="${nonce}">
        (function() {
            'use strict';
            
            let state = {
                sessionId: document.getElementById('session-id').value || generateSessionId(),
                attempts: 5,
                expiryTime: null
            };
            
            const elements = {
                form: document.getElementById('captcha-form'),
                image: document.getElementById('captcha-image'),
                input: document.getElementById('captcha-input'),
                verifyBtn: document.getElementById('verify-btn'),
                refreshBtn: document.getElementById('refresh-btn'),
                errorAlert: document.getElementById('error-alert'),
                successAlert: document.getElementById('success-alert'),
                attemptsDisplay: document.getElementById('attempts'),
                expiryDisplay: document.getElementById('expires')
            };
            
            function init() {
                generateCaptcha();
                setupEventListeners();
                startTimer();
            }
            
            function setupEventListeners() {
                elements.form.addEventListener('submit', handleSubmit);
                elements.refreshBtn.addEventListener('click', handleRefresh);
                elements.input.addEventListener('input', handleInput);
            }
            
            function handleInput(e) {
                e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            }
            
            async function handleSubmit(e) {
                e.preventDefault();
                const input = elements.input.value.trim();
                if (input.length !== 5) {
                    showAlert('error', 'Please enter exactly 5 characters.');
                    return;
                }
                await validateCaptcha(input);
            }
            
            async function handleRefresh(e) {
                e.preventDefault();
                elements.input.value = '';
                await generateCaptcha();
            }
            
            async function generateCaptcha() {
                try {
                    const formData = new FormData();
                    formData.append('sessionId', state.sessionId);
                    formData.append('_csrf', document.getElementById('csrf-token').value);
                    
                    const response = await fetch('/security/captcha/generate', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        elements.image.src = 'data:image/png;base64,' + data.imageBase64;
                        state.expiryTime = new Date(Date.now() + data.ttlSeconds * 1000);
                        showAlert('success', 'New CAPTCHA generated.');
                    } else {
                        showAlert('error', 'Failed to generate CAPTCHA.');
                    }
                } catch (error) {
                    showAlert('error', 'Generation failed. Please try again.');
                }
            }
            
            async function validateCaptcha(input) {
                try {
                    const formData = new FormData();
                    formData.append('sessionId', state.sessionId);
                    formData.append('captchaInput', input);
                    formData.append('_csrf', document.getElementById('csrf-token').value);
                    
                    const response = await fetch('/security/captcha/validate', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    if (data.success && data.valid) {
                        showAlert('success', '✅ Verified! Redirecting...');
                        setTimeout(() => window.location.href = '/login', 2000);
                    } else {
                        state.attempts--;
                        elements.attemptsDisplay.textContent = state.attempts;
                        showAlert('error', data.message || 'Invalid CAPTCHA.');
                        
                        if (state.attempts <= 0) {
                            showAlert('error', 'Maximum attempts reached.');
                            elements.form.querySelectorAll('input, button').forEach(el => el.disabled = true);
                        } else if (data.regenerateRequired) {
                            generateCaptcha();
                        }
                        elements.input.value = '';
                    }
                } catch (error) {
                    showAlert('error', 'Validation failed. Please try again.');
                }
            }
            
            function showAlert(type, message) {
                hideAlerts();
                const alert = type === 'error' ? elements.errorAlert : elements.successAlert;
                alert.textContent = message;
                alert.classList.add('show');
                setTimeout(() => alert.classList.remove('show'), 5000);
            }
            
            function hideAlerts() {
                elements.errorAlert.classList.remove('show');
                elements.successAlert.classList.remove('show');
            }
            
            function startTimer() {
                setInterval(() => {
                    if (state.expiryTime) {
                        const timeLeft = Math.max(0, Math.floor((state.expiryTime - new Date()) / 1000));
                        const minutes = Math.floor(timeLeft / 60);
                        const seconds = timeLeft % 60;
                        elements.expiryDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                        
                        if (timeLeft <= 0) {
                            generateCaptcha();
                        }
                    }
                }, 1000);
            }
            
            function generateSessionId() {
                return 'captcha_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }
            
            init();
        })();
    </script>
</body>
</html>
