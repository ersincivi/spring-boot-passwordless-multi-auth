<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status} + ' ' + #{error.generic.title}">Error</title>
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    
    <style>
        /* Base CSS Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
			background: linear-gradient(135deg, #6C63FF 0%, #4A44D6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .error-logo {
            margin-bottom: 30px;
        }

        .error-logo .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .error-logo .logo a {
            text-decoration: none;
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .error-message {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #e74c3c;
        }

        .home-btn {
            display: inline-block;
            padding: 15px 30px;
            background:#4A44D6;
            color: white;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .home-btn:active {
            transform: translateY(0);
        }

        .error-details {
            background: rgba(248, 249, 250, 0.8);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            font-family: monospace;
            font-size: 0.9rem;
            color: #495057;
            max-height: 200px;
            overflow-y: auto;
        }

        .error-details h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
            font-size: 1rem;
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            .error-container {
                padding: 30px 20px;
                margin: 10px;
                max-width: none;
            }

            .error-logo .logo {
                font-size: 2rem;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-message {
                font-size: 1rem;
            }
        }

        /* Focus improvements for accessibility */
        a:focus-visible,
        button:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-logo">
             <div class="logo"><a href="/">Passwordless Multi-Auth</a></div>
        </div>
        
        <div class="error-icon" aria-hidden="true">💥</div>
        
        <h1 class="error-title" th:text="${status} + ' ' + #{error.generic.title}">Error</h1>
        
        <p class="error-message" th:text="${message}">An error occurred.</p>
        
        <!-- <div class="error-details" th:if="${trace}" th:text="${trace}"></div> -->
        
        <a href="/" class="home-btn" th:text="#{error.backHome}">Back to Home</a>
    </div>
</body>
</html>
