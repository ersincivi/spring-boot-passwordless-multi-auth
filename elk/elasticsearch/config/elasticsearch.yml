# Elasticsearch Configuration for Passwordless Multi-Auth Application

cluster.name: "passwordless-cluster"
network.host: 0.0.0.0

# Node settings
node.name: "passwordless-node"
node.roles: ["master", "data", "ingest"]

# Discovery settings for single node
discovery.type: single-node

# Security settings (disabled for development)
xpack.security.enabled: false
xpack.monitoring.collection.enabled: true

# Memory settings
bootstrap.memory_lock: true

# Index settings
action.auto_create_index: "+security-audit-*,+application-logs-*,+container-logs-*,+passwordless-*,-*"

# Performance settings
index.number_of_shards: 1
index.number_of_replicas: 0
index.refresh_interval: 30s

# Cluster settings
cluster.routing.allocation.disk.threshold_enabled: true
cluster.routing.allocation.disk.watermark.low: 85%
cluster.routing.allocation.disk.watermark.high: 90%
cluster.routing.allocation.disk.watermark.flood_stage: 95%

# HTTP settings
http.port: 9200
transport.port: 9300

# Monitoring settings
xpack.monitoring.enabled: true