# Kibana configuration for Passwordless Multi-Auth (Kibana 8.x)

server.name: "passwordless-kibana"
server.host: "0.0.0.0"
server.port: 5601

# Elasticsearch
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.requestTimeout: 30000
elasticsearch.shardTimeout: 30000

# Saved-objects encryption (dev-only key; replace in production)
xpack.encryptedSavedObjects.encryptionKey: "a7a6311933d3503b89bc2dbc36572c33a7a6311933d3503b"

# Monitoring
monitoring.kibana.collection.enabled: true
monitoring.ui.container.elasticsearch.enabled: true

# Container-friendly logging (stdout only)
logging.root.level: info

# Quiet the dev experience
telemetry.enabled: false
newsfeed.enabled: false

# Performance
server.maxPayload: 1048576
