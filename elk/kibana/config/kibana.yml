# Kibana Configuration for Passwordless Multi-Auth Application

server.name: "passwordless-kibana"
server.host: "0.0.0.0"
server.port: 5601

# Elasticsearch configuration
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.requestTimeout: 30000
elasticsearch.shardTimeout: 30000

# Security settings (disabled for development)
xpack.security.enabled: false
xpack.encryptedSavedObjects.encryptionKey: "a7a6311933d3503b89bc2dbc36572c33a7a6311933d3503b"

# Monitoring
xpack.monitoring.enabled: true
xpack.monitoring.kibana.collection.enabled: true
xpack.monitoring.ui.container.elasticsearch.enabled: true

# Logging
logging.appenders.file.type: file
logging.appenders.file.fileName: /usr/share/kibana/logs/kibana.log
logging.appenders.file.layout.type: json
logging.loggers:
  - name: plugins.security
    appenders: [file]
    level: info
logging.root.level: info

# Dashboard and visualization settings
map.includeElasticMapsService: false
telemetry.enabled: false
newsfeed.enabled: false

# Performance settings
server.maxPayload: 1048576
elasticsearch.requestHeadersWhitelist: ["authorization"]

# Default index pattern
kibana.defaultAppId: "dashboard"